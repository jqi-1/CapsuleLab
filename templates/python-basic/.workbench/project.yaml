name: my-project
description: Python data science project

runtime:
  type: docker
  dockerfile: Dockerfile
  image: my-project:dev
  gpu: false

mounts:
  - source: .
    target: /workspace
  - source: ./data
    target: /workspace/data
  - source: ./models
    target: /workspace/models

environment:
  PYTHONPATH: /workspace/src

apps:
  - name: JupyterLab
    id: jupyter
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    port: 8888
    url_path: /
