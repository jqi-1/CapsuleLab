[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "capsulelab"
version = "0.1.0"
description = "Local-first containerized project runtime manager for reproducible AI and data-science work"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.scripts]
cap = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["capsulelab*", "backend*", "cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that require a running Docker daemon",
    "ssh: tests that require a configured SSH remote host",
    "compose: tests that require Docker Compose",
    "pure_config: tests that require no Docker, SSH, or Compose runtime",
]
