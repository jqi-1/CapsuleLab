name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest ruff
      - name: Lint with ruff
        run: ruff check .
      - name: Test with pytest
        run: pytest -m "not docker and not ssh and not compose"
